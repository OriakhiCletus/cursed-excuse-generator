<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Random Excuse Generator (For Everything)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>The Random Excuse Generator (For Everything)</h1>
        <p>Need an excuse? Click the button! Need chaos? Click the other button!</p>

        <div class="button-group">
            <button id="generateBtn">Generate Excuse</button>
            <button id="generateBtn2">Generate Excuse (Alt)</button>
        </div>

        <div id="excuseDisplay" class="excuse-box">
            <!-- Excuse will appear here -->
        </div>

        <div class="button-group">
            <button id="debunkBtn">Debunk Excuse</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
